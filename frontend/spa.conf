server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Los archivos con hash en el nombre no cambian nunca: cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index cambia en cada despliegue: nunca se cachea. Sin esto, el
    # navegador sigue pidiendo los chunks de la build anterior.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
