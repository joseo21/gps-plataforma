server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Los archivos con hash en el nombre no cambian nunca: cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index cambia en cada despliegue: nunca se cachea. Sin esto, el
    # navegador sigue pidiendo los chunks de la build anterior.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Vary "*";
        etag off;
        expires 0;
    }

    # Un chunk que ya no existe devuelve 404, no el index disfrazado de JS.
    # Asi el navegador falla de forma visible en vez de en silencio.
    location ~* \.(js|css|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
